<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interval Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <!-- Type d'exercice -->
      <div class="section">
        <label>Type d’exercice</label>
        <div class="switch-group" id="exercise-type">
          <button class="type-btn active" data-type="interval">
            Intervals
          </button>
          <button class="type-btn" data-type="chords">Accords</button>
          <button class="type-btn" data-type="mode">Modes</button>
        </div>
      </div>

      <!-- Options (intervals/accords/modes) -->
      <div class="section">
        <label>Options</label>
        <div class="switch-group grid" id="exercise-options">
          <!-- boutons générés dynamiquement -->
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="section actions">
        <button id="start-stop">▶ Jouer</button>
      </div>

      <div class="section">
        <p>Note de départ : <span id="starting-note"></span></p>
      </div>

      <br />
      <div class="container" id="btn-validate">
        <button id="validate">Valider</button>
      </div>
      <div class="container" id="btn-nextQuestion">
        <button id="nextQuestion">Question suivante</button>
      </div>

      <h3 id="result"></h3>

      <p>Score :</p>
      <p>✅ <span id="correct">0</span> | ❌ <span id="wrong">0</span></p>
    </div>

    <script src="Tone.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
